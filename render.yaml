databases:
  - name: repomind-db
    databaseName: repomind
    user: repomind

services:
  - type: redis
    name: repomind-redis
    ipAllowList: []

  - type: web
    name: repomind-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && ./start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: repomind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: repomind-redis
          property: connectionString
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
